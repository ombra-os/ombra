# Ombra desktop — debian-installer preseed (Debian trixie, arm64), packed into the install ISO initrd.
# The grub entry runs FULLY UNATTENDED (auto=true priority=critical) — any question that surfaces is a bug here.
# Layout (unattended crypto carries exactly ONE crypto partition): p1 EFI 512M, p2 /boot 1G
# (both plain — grub cannot unlock argon2id LUKS2), p3 LUKS2 argon2id -> LVM vg0: root + swap.
# NIC swap is a HOST-side act: install on NAT, switch to intnet before first boot.
# The disk passphrase below is a PUBLIC build value, committed on purpose.

### ---- Locale / console ----

d-i debian-installer/locale string en_US
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/keymap select us
d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/layoutcode string us

### ---- Network ----
# Only the temporary NAT NIC exists during the install.

d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_failed note
# all template variants pinned — an interactive run surfaced the get_
# forms as the actually-asked questions; late-command repairs anyway
d-i netcfg/hostname string ombra
d-i netcfg/get_hostname string ombra
d-i netcfg/get_domain string local
netcfg netcfg/dhcp_options select Configure network automatically

### ---- Mirror ----

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/suite string trixie
d-i mirror/http/proxy string

### ---- apt-setup ----
# Question names must be FULL (apt-setup/...): unknown short names register as dead dummy questions and the real question keeps its default.
apt-setup apt-setup/security_host string deb.debian.org
apt-setup apt-setup/services-select multiselect security, updates
apt-setup apt-setup/non-free-firmware boolean true
apt-setup apt-setup/non-free boolean false
apt-setup apt-setup/contrib boolean true
apt-setup apt-setup/enable-source-repositories boolean false
# a main-mirror failure stays LOUD; only the per-service prompt is answered
apt-setup apt-setup/service-failed boolean true
# never configure apt from the install media (not a Debian media)
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false

### ---- Accounts ----
# Root and ombra are both born locked (`*`); first-use chpasswd sets the real user password.

d-i passwd/root-login boolean false
d-i passwd/root-password-crypted string *
d-i passwd/user-fullname string ombra
d-i passwd/username string ombra
d-i passwd/user-password-crypted string *
d-i passwd/user-default-groups string audio video
d-i user-setup/allow-password-weak boolean true

### ---- Clock ----
# Fusion populates the RTC with the HOST'S LOCAL time: utc=false plus the build host's zone is the
# only deterministic decode (sqv rejects fresh repo signatures otherwise); the late command normalizes to UTC.
d-i clock-setup/utc boolean false
d-i clock-setup/ntp boolean true
d-i time/zone string America/New_York

### ---- Partitioning: LUKS2 + argon2id root ----
# partman-auto crypto supports exactly one method{ crypto } entry (the LVM PV); partman-crypto luksFormats
# has no --type/--pbkdf, so the format is cryptsetup's default — first-use re-keys with pinned argon2id parameters.
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/method string crypto
d-i partman-auto/choose_recipe select ombra-crypt
d-i partman-auto/expert_recipe string                    \
   ombra-crypt ::                                        \
      512 512 512 free                                   \
         $primary{ } $iflabel{ gpt }                     \
         method{ efi } format{ }                         \
      .                                                  \
      1024 1024 1024 ext4                                \
         $primary{ } $defaultignore{ }                   \
         method{ format } format{ }                      \
         use_filesystem{ } filesystem{ ext4 }            \
         mountpoint{ /boot }                             \
      .                                                  \
      1 1 -1 ext4                                        \
         $primary{ }                                     \
         method{ crypto }                                \
      .                                                  \
         1 11000 -1 ext4                                 \
            $lvmok{ } lv_name{ root }                    \
            method{ format } format{ }                   \
            use_filesystem{ } filesystem{ ext4 }         \
            mountpoint{ / }                              \
         .                                               \
         4096 4096 4096 linux-swap                       \
            $lvmok{ } lv_name{ swap }                    \
            method{ swap } format{ }                     \
         .                                               \
      .

# generic VG name (the <hostname>-vg default is fingerprintable)
d-i partman-auto-lvm/new_vg_name string vg0
d-i partman-auto-lvm/guided_size string max

# PUBLIC BUILD VALUE — the shipped product must ask the user and never
# ship this string.
d-i partman-crypto/passphrase password ombra-disk
d-i partman-crypto/passphrase-again password ombra-disk
# unanswered weak-passphrase prompt breaks the whole unattended flow
d-i partman-crypto/weak_passphrase boolean true

# the swap LV converts to per-boot random-key dm-crypt in late-command (partman cannot carry a second crypto partition);
# no pre-LUKS wipe — fresh zero VDI.
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-crypto/confirm boolean true

# the confirm family is closed: preseed ALL of it — nothing may ask
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman-crypto/confirm boolean true
d-i partman-crypto/confirm_nooverwrite boolean true

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### ---- Package selection ----
# LEAN base; the Plasma session stack is installed by late-command as one recommends-off transaction.
# xserver-xorg-video-vmware must stay OUT: no arm64 build — listing it kills pkgsel.
# libssl3t64 FIRST: ordering bug with openssh-server otherwise.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string libssl3t64 overlayroot network-manager nftables xserver-xorg xserver-xorg-input-libinput open-vm-tools-desktop pipewire-audio keepassxc dolphin metadata-cleaner fonts-jetbrains-mono fonts-montserrat fonts-noto-core fonts-noto-color-emoji kitty zsh zsh-autosuggestions zsh-syntax-highlighting starship ripgrep fd-find bat eza fzf zoxide git curl cryptsetup cryptsetup-bin dmsetup
popularity-contest popularity-contest/participate boolean false
man-db man-db/auto-update boolean false
d-i pkgsel/upgrade select none

### ---- GRUB ----
# /boot and the ESP are unencrypted, so grub needs no LUKS support.
# No console= on the installed system: a dead console= would sink /dev/console.

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

### ---- Finish ----

d-i finish-install/reboot_in_progress note
# power off (not reboot): the post-install step swaps NIC1 to intnet
# before first boot; poweroff is the install-finished signal
d-i debian-installer/exit/poweroff boolean true
