# Ombra desktop — debian-installer preseed (Debian trixie, arm64), packed into the install ISO initrd.
# The grub entry runs FULLY UNATTENDED (auto=true priority=critical) — any question that surfaces is a bug here.
# Layout (unattended crypto carries exactly ONE crypto partition): EFI 512M, /boot 1G
# (both plain — grub cannot unlock argon2id LUKS2), then LUKS2 argon2id -> LVM vg0: root (fixed ~12 GB) + home (the rest) + swap.
# Partition numbers are not pinned: with the recipe applied the container is the third partition, and Debian's fallback layout made it the fourth;
# nothing may hardcode either — late-command and ombra-welcome discover the container (blkid / crypttab).
# NIC swap is a HOST-side act: install on NAT, switch to intnet before first boot.
# The disk passphrase below is a PUBLIC build value, committed on purpose.

### ---- Locale / console ----

d-i debian-installer/locale string en_US
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/keymap select us
d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/layoutcode string us

### ---- Network ----
# Only the temporary NAT NIC exists during the install.

d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_failed note
# all template variants pinned — an interactive run surfaced the get_
# forms as the actually-asked questions; late-command repairs anyway
d-i netcfg/hostname string ombra
d-i netcfg/get_hostname string ombra
d-i netcfg/get_domain string local
netcfg netcfg/dhcp_options select Configure network automatically
# keep the installer's own DHCP profile out of the installed system: netcfg's finish hook would otherwise copy it into
# NetworkManager next to Ombra's static profile (it lost on priority and the firewall blocked it, but it does not belong)
d-i netcfg/target_network_config select loopback

### ---- Mirror ----

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/suite string trixie
d-i mirror/http/proxy string

### ---- apt-setup ----
# Question names must be FULL (apt-setup/...): unknown short names register as dead dummy questions and the real question keeps its default.
apt-setup apt-setup/security_host string deb.debian.org
# no security/updates services in d-i: a failed fetch there is an error template no preseed can answer, and it
# stalls the unattended install. late-command adds both suites, retries, and upgrades the image to them.
apt-setup apt-setup/services-select multiselect
apt-setup apt-setup/non-free-firmware boolean true
apt-setup apt-setup/non-free boolean false
apt-setup apt-setup/contrib boolean true
apt-setup apt-setup/enable-source-repositories boolean false
# never configure apt from the install media (not a Debian media)
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false

### ---- Accounts ----
# Root and ombra are both born locked (`*`); first-use chpasswd sets the real user password.

d-i passwd/root-login boolean false
d-i passwd/root-password-crypted string *
d-i passwd/user-fullname string ombra
d-i passwd/username string ombra
d-i passwd/user-password-crypted string *
d-i passwd/user-default-groups string audio video
d-i user-setup/allow-password-weak boolean true

### ---- Clock ----
# The RTC is UTC on both hypervisors: the Fusion vmx pins rtc.diffFromUTC=0 (its default is the host's LOCAL time,
# which put the guest hours off and told it the host's timezone) and UTM runs RTCLocalTime off. No build-host zone
# is assumed anywhere; late-command also checks the clock against the mirror host before apt judges signature dates.
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true
d-i time/zone string UTC

### ---- Partitioning: LUKS2 + argon2id root ----
# the crypto method adds the encrypted LVM volume itself: the recipe lists only the ESP, /boot and the logical volumes.
# Every entry ends in one '.', and a stray '.' is an empty entry that partman scores as larger than any disk, which makes it
# skip the whole recipe and fall back to Debian's default layout without an error. partman-crypto luksFormats
# has no --type/--pbkdf, so the format is cryptsetup's default — first-use re-keys with pinned argon2id parameters.
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/method string crypto
d-i partman-auto/choose_recipe select ombra-crypt
d-i partman-auto/expert_recipe string                    \
   ombra-crypt ::                                        \
      512 512 512 free                                   \
         $primary{ } $iflabel{ gpt }                     \
         method{ efi } format{ }                         \
      .                                                  \
      1024 1024 1024 ext4                                \
         $primary{ } $defaultignore{ }                   \
         method{ format } format{ }                      \
         use_filesystem{ } filesystem{ ext4 }            \
         mountpoint{ /boot }                             \
      .                                                  \
      12000 12000 12000 ext4                             \
         $lvmok{ } lv_name{ root }                       \
         method{ format } format{ }                      \
         use_filesystem{ } filesystem{ ext4 }            \
         mountpoint{ / }                                 \
      .                                                  \
      4096 4096 4096 linux-swap                          \
         $lvmok{ } lv_name{ swap }                       \
         method{ swap } format{ }                        \
      .                                                  \
      2048 10000 -1 ext4                                 \
         $lvmok{ } lv_name{ home }                       \
         method{ format } format{ }                      \
         use_filesystem{ } filesystem{ ext4 }            \
         mountpoint{ /home }                             \
      .

# generic VG name (the <hostname>-vg default is fingerprintable)
d-i partman-auto-lvm/new_vg_name string vg0
# root and swap are fixed (min = max), home takes the rest of the 88%: a deterministic layout on the 30 GB disk.
# /home is its own LV so an update rollback (a merge of root's snapshot) never reverts the user's files.
# leave ~12% of the volume group unallocated: ombra-update snapshots root there before every update
d-i partman-auto-lvm/guided_size string 88%

# PUBLIC BUILD VALUE — the shipped product must ask the user and never
# ship this string.
d-i partman-crypto/passphrase password ombra-disk
d-i partman-crypto/passphrase-again password ombra-disk
# unanswered weak-passphrase prompt breaks the whole unattended flow
d-i partman-crypto/weak_passphrase boolean true

# the swap LV converts to per-boot random-key dm-crypt in late-command (partman cannot carry a second crypto partition);
# no pre-LUKS wipe — fresh zero VDI.
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-crypto/confirm boolean true

# the confirm family is closed: preseed ALL of it — nothing may ask
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman-crypto/confirm boolean true
d-i partman-crypto/confirm_nooverwrite boolean true

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### ---- Package selection ----
# LEAN base; the Plasma session stack is installed by late-command as one recommends-off transaction.
# xserver-xorg-video-vmware must stay OUT: no arm64 build — listing it kills pkgsel.
# Guest tools for every supported hypervisor ship in the one image: open-vm-tools (VMware Fusion), qemu-guest-agent + spice-vdagent (QEMU/UTM).
# Each starts only when its virtio/VMware channel exists; late-command locks the QEMU ones down.
# libssl3t64 FIRST: ordering bug with openssh-server otherwise.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssl pkexec libssl3t64 overlayroot network-manager nftables xserver-xorg xserver-xorg-input-libinput open-vm-tools-desktop qemu-guest-agent spice-vdagent pipewire-audio keepassxc dolphin metadata-cleaner fonts-jetbrains-mono fonts-noto-core fonts-noto-color-emoji kitty zsh zsh-autosuggestions zsh-syntax-highlighting starship ripgrep fd-find bat eza fzf zoxide git curl cryptsetup cryptsetup-bin dmsetup
popularity-contest popularity-contest/participate boolean false
man-db man-db/auto-update boolean false
d-i pkgsel/upgrade select none

### ---- GRUB ----
# /boot and the ESP are unencrypted, so grub needs no LUKS support.
# No console= on the installed system: a dead console= would sink /dev/console.

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

### ---- Finish ----

d-i finish-install/reboot_in_progress note
# power off (not reboot): the post-install step swaps NIC1 to intnet
# before first boot; poweroff is the install-finished signal
d-i debian-installer/exit/poweroff boolean true
