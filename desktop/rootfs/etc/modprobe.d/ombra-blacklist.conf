# Ombra desktop module blacklist: modules this machine (one NVMe disk,
# one virtio NIC, EFI, vmsvga framebuffer) can never legitimately need.

# rare/legacy filesystems: pure attack surface
blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist hfs
blacklist hfsplus
blacklist ufs
blacklist qnx6
blacklist squashfs
blacklist udf

# no bluetooth hardware exists
blacklist bluetooth
blacklist btusb
blacklist hci_uart

# obsolete/rarely-audited network protocols
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc
blacklist n-hdlc

# hardware this VM does not have
blacklist firewire-core
blacklist firewire_ohci
blacklist vivid
