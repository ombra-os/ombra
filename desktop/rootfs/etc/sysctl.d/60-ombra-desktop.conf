# Ombra desktop kernel parameters — the workstation twin of the
# gateway's 60-ombra-gateway.conf; review like firewall rules.

net.ipv4.ip_forward = 0

# a spoofed source is dropped
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# never accept or send ICMP redirects (MITM lever on a two-peer link)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# IPv6 off: a half-configured v6 stack is the classic leak
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1

net.ipv4.conf.all.log_martians = 1

# console = errors only; everything still lands in the journal
kernel.printk = 3 4 1 3

# ---- privilege-escalation surface ----
# Only keys weaker than the trixie default are set. kernel.modules_disabled
# is deliberately NOT set (module autoload stays usable).

# no kernel pointers, even via %pK
kernel.kptr_restrict = 2

kernel.sysrq = 0

# no ptrace at all, even same-user (browsers/wallets hold secrets)
kernel.yama.ptrace_scope = 3

# no runtime kernel replacement, even for root
kernel.kexec_load_disabled = 1

# io_uring: outsized kernel-CVE share, nothing here uses it
kernel.io_uring_disabled = 2

# 1 locks unprivileged BPF until reboot
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

dev.tty.ldisc_autoload = 0

# ---- network-stack integrity ----

net.ipv4.tcp_rfc1337 = 1

fs.protected_fifos = 2

# ---- memory / crash / panic posture ----

# no NULL-page mappings, even for root
vm.mmap_min_addr = 65536

# core dumps never leave the kernel; setuid dumps are off
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0

# panic posture deliberately at kernel defaults: hardened oops limits hang the unlock path; kernel defaults kill the oopsing task and journal it.

# ---- link hygiene (single-peer intnet) ----

# answer ARP only for our own address on the arriving interface
net.ipv4.conf.all.arp_ignore = 2
net.ipv4.conf.default.arp_ignore = 2

# a two-peer point-to-point link is not shared media
net.ipv4.conf.all.shared_media = 0
net.ipv4.conf.default.shared_media = 0

net.ipv4.tcp_timestamps = 0

# nothing pings the desktop; inbound echo is dead
net.ipv4.icmp_echo_ignore_all = 1
