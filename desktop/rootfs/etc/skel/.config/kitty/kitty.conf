# kitty — the Ombra terminal.

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5
# Nerd Font glyphs render wider than 100% or kitty draws boxes
modify_font cell_width 105%
modify_font cell_height 106%
# JetBrains Mono ligatures fuse the ring art's ==/-=/+= runs into wrong glyphs
disable_ligatures always

background_opacity 0.88
background_blur 24
dynamic_background_opacity no
window_padding_width 14 12
window_margin_width 0
single_window_padding_width 14 12

# window chrome: Plasma already draws Colloid aurorae decorations
hide_window_decorations no
remember_window_size yes

# a click must never be a network action
scrollback_lines 10000
detect_urls yes
open_url_with default
url_style curly

# Ombra palette
foreground              #f4f3ef
background              #0b0c11
selection_foreground    #0b0c11
selection_background    #8f9bff
cursor                  #8f9bff
cursor_text_color       #0b0c11
url_color               #8f9bff
color0                  #151821
color8                  #5c6070
color1                  #f0716b
color9                  #ff8f89
color2                  #56d68a
color10                 #7fe6a6
color3                  #f2c260
color11                 #f7d68a
color4                  #8f9bff
color12                 #b3bcff
color5                  #c39bff
color13                 #d7b9ff
color6                  #6fd4d4
color14                 #98e6e6
color7                  #d9dce6
color15                 #f4f3ef

tab_bar_style           separator
tab_separator           " "
tab_bar_margin_height   8 0
tab_bar_min_tabs        2
tab_title_template      "  {index}  {title}  "
active_tab_title_template "  {index}  {title}  "
active_tab_foreground   #0b0c11
active_tab_background   #8f9bff
active_tab_font_style   bold
inactive_tab_foreground #9aa0b4
inactive_tab_background #151821
inactive_tab_font_style normal
tab_bar_background      #0b0c11

active_border_color     #8f9bff
inactive_border_color   #2a2f3f
window_border_width     0.5pt
