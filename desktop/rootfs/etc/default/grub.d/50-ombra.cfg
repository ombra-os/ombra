# hardening cmdline MINUS init_on_free (its timing perturbation rides a marginal vmwgfx display race); the boot-mode entries append their overlayroot parameter.
GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=3 systemd.show_status=0 slab_nomerge init_on_alloc=1 page_alloc.shuffle=1 randomize_kstack_offset=on debugfs=off"
