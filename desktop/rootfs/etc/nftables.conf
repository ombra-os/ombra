#!/usr/sbin/nft -f
# local backstop: the desktop is a CLIENT — its only legitimate peer is the gateway (10.55.10.1).
# No iifname/oifname anywhere: the NIC carries no pinned name (NM matches any ethernet device), only the gateway address is stable.

flush ruleset

table inet filter {

  chain input {
    type filter hook input priority filter; policy drop;

    # source must be routable via the arriving interface
    fib saddr . iif oif missing counter drop

    # malformed traffic can never be filtered by port
    ct state invalid counter drop
    tcp flags & (fin | syn | rst | ack) == fin | syn counter drop
    tcp flags & (syn | rst) == syn | rst counter drop
    tcp flags & (fin | syn | rst | ack) == fin | rst | ack counter drop
    tcp flags & (fin | syn | rst | ack) == 0x0 counter drop
    ip frag-off & 0x1fff != 0 counter drop

    ct state established,related counter accept

    iifname "lo" counter accept

    # an onion service published through the gateway's Tor (OnionShare): the gateway, and only the gateway, may connect to these ports
    ip saddr 10.55.10.1 tcp dport 17600-17659 counter accept

    # link diagnostics from the gateway only; allowed so a debug session can re-enable answering without touching this file
    ip saddr 10.55.10.1 ip protocol icmp icmp type echo-request counter accept

    # only what PMTUD needs end-to-end
    ip protocol icmp icmp type destination-unreachable counter accept
    ip protocol icmp counter drop
    ip6 nexthdr icmpv6 counter drop comment "no IPv6 anywhere, ever"

    counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    # a workstation forwards nothing
    counter drop
  }

  chain output {
    type filter hook output priority filter; policy drop;

    ct state invalid counter drop
    tcp flags & (fin | syn | rst | ack) == fin | syn counter drop
    tcp flags & (syn | rst) == syn | rst counter drop
    ip frag-off & 0x1fff != 0 counter drop

    # name lookups, per user: generous enough for a script that opens hundreds of connections at once (each lookup is
    # two packets), tight enough that a flood takes a long time to use up ombra-tproxy's address pool. Before the
    # established-flow accept below: a flood from one socket is one flow
    ip daddr 127.0.0.1 udp dport 5399 meter ombra_tproxy_names { meta skuid limit rate over 2000/second burst 10000 packets } counter drop comment "name lookup flood from one user"

    ct state established,related counter accept

    oifname "lo" counter accept

    # what the nat table below turned around to ombra-tproxy: the destination is already loopback, but at this point the
    # packet still carries the interface it was first routed to, so the rule above does not see it
    # per user, so one program cannot use up the proxy for everyone else: at most 512 redirected connections at a time
    ip daddr 127.0.0.1 tcp dport 9041 meter ombra_tproxy_conns { meta skuid ct count over 512 } counter reject with tcp reset comment "too many redirected connections for one user"
    ip daddr 127.0.0.1 tcp dport 9041 counter accept comment "redirected TCP -> ombra-tproxy"
    ip daddr 127.0.0.1 udp dport 5399 counter accept comment "redirected DNS -> ombra-tproxy stub"

    # the gateway is the only egress (SOCKS 9050, DNS 53, control 9052 — all on 10.55.10.1)
    ip daddr 10.55.10.1 counter accept

    ip protocol icmp icmp type destination-unreachable icmp code frag-needed counter accept

    counter reject
  }
}

# ---- ip nat: programs that know nothing about proxies ----
# Everything this machine sends is either for the gateway or is turned around here: a DNS question goes to the local
# stub of ombra-tproxy, which answers with a placeholder address, and a TCP connection to anything but the gateway goes
# to ombra-tproxy, which hands it to the gateway's Tor as a SOCKS CONNECT by name. systemd holds both ports
# (ombra-tproxy.socket), so no other program can take them; while ombra-tproxy is not running the redirected traffic waits
# there and goes nowhere. Nothing can leave any other way (the filter table above is unchanged).
table ip nat {

  chain output {
    type nat hook output priority dstnat; policy accept;

    udp dport 53 counter redirect to :5399 comment "DNS -> local stub (placeholder answers, nothing leaves)"
    ip daddr != { 10.55.10.1, 127.0.0.0/8 } meta l4proto tcp counter redirect to :9041 comment "TCP -> ombra-tproxy -> gateway SOCKS"
  }
}

# no IPv6 table: the sysctl overlay disables the stack; the input-chain
# icmpv6 drop is belt-and-braces
