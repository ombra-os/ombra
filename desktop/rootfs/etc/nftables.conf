#!/usr/sbin/nft -f
# local backstop: the desktop is a CLIENT — its only legitimate peer is the gateway (10.55.10.1).
# No iifname/oifname anywhere: the NIC carries no pinned name (NM matches any ethernet device), only the gateway address is stable.

flush ruleset

table inet filter {

  chain input {
    type filter hook input priority filter; policy drop;

    # source must be routable via the arriving interface
    fib saddr . iif oif missing counter drop

    # malformed traffic can never be filtered by port
    ct state invalid counter drop
    tcp flags & (fin | syn | rst | ack) == fin | syn counter drop
    tcp flags & (syn | rst) == syn | rst counter drop
    tcp flags & (fin | syn | rst | ack) == fin | rst | ack counter drop
    tcp flags & (fin | syn | rst | ack) == 0x0 counter drop
    ip frag-off & 0x1fff != 0 counter drop

    ct state established,related counter accept

    iifname "lo" counter accept

    # an onion service published through the gateway's Tor (OnionShare): the gateway, and only the gateway, may connect to these ports
    ip saddr 10.55.10.1 tcp dport 17600-17659 counter accept

    # link diagnostics from the gateway only; allowed so a debug session can re-enable answering without touching this file
    ip saddr 10.55.10.1 ip protocol icmp icmp type echo-request counter accept

    # only what PMTUD needs end-to-end
    ip protocol icmp icmp type destination-unreachable counter accept
    ip protocol icmp counter drop
    ip6 nexthdr icmpv6 counter drop comment "no IPv6 anywhere, ever"

    counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    # a workstation forwards nothing
    counter drop
  }

  chain output {
    type filter hook output priority filter; policy drop;

    ct state invalid counter drop
    tcp flags & (fin | syn | rst | ack) == fin | syn counter drop
    tcp flags & (syn | rst) == syn | rst counter drop
    ip frag-off & 0x1fff != 0 counter drop

    ct state established,related counter accept

    oifname "lo" counter accept

    # the gateway is the only egress (SOCKS 9050, DNS 53, control 9052 — all on 10.55.10.1)
    ip daddr 10.55.10.1 counter accept

    ip protocol icmp icmp type destination-unreachable icmp code frag-needed counter accept

    counter reject
  }
}

# no IPv6 table: the sysctl overlay disables the stack; the input-chain
# icmpv6 drop is belt-and-braces
