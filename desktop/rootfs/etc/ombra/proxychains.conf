# apps without a reliable proxy setting of their own run through this: every connection goes to the gateway's Tor
# (the desktop firewall already refuses anything else, so a failure here fails closed)
strict_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 30000
tcp_connect_time_out 15000
localnet 127.0.0.0/255.0.0.0

[ProxyList]
socks5 10.55.10.1 9050
