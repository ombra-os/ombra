[workspace]

[package]
name = "ombra-boot"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Ombra boot & first-run experience: branded disk-unlock agent and first-use setup TUI"
publish = false

[lib]
name = "ombra_boot"
path = "src/lib.rs"

[[bin]]
name = "ombra-askpass"
path = "src/bin/ombra-askpass.rs"

[[bin]]
name = "ombra-welcome"
path = "src/bin/ombra-welcome.rs"

[[bin]]
name = "ombra-statusd"
path = "src/bin/ombra-statusd.rs"

[[bin]]
name = "ombra-torctl-filter"
path = "src/bin/ombra-torctl-filter.rs"

# Pure-Rust deps only, so the initramfs binary can link musl-static.
[dependencies]
libc = "0.2"
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
zeroize = "1"
# fb face only: pure-Rust glyph rasterizer.
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
# statusd only: parse (never write) the one-line JSON status snapshot;
# writing is a hand-rolled format! so the byte order stays pinned.
serde_json = "1"

[profile.release]
strip = true
