#!/usr/sbin/nft -f
# fail-closed: desktop TCP is REDIRECTed to Tor's TransPort (never routed), Tor is the only egress.
# iifname/oifname are udev-assigned from the NIC driver (vmxnet3 upstream, e1000e private link) — never the kernel's predictable names.

flush ruleset

# ---- inet filter ----
table inet filter {

  chain input {
    type filter hook input priority filter; policy drop;

    # no ssh accept rule, on purpose: no sshd ships and none ever may

    fib saddr . iif oif missing counter drop

    # malformed traffic can never be filtered by port
    ct state invalid counter drop
    tcp flags & (fin | syn | rst | ack) == fin | syn counter drop
    tcp flags & (syn | rst) == syn | rst counter drop
    tcp flags & (fin | syn | rst | ack) == fin | rst | ack counter drop
    tcp flags & (fin | syn | rst | ack) == 0x0 counter drop
    ip frag-off & 0x1fff != 0 counter drop

    ct state established,related counter accept

    iifname "lo" counter accept

    # the upstream lease: the OFFER/ACK is a broadcast reply, not conntrack-established
    iifname "ombra-upstream" udp sport 67 udp dport 68 counter accept comment "upstream DHCP server -> gateway lease"

    # everything else from the desktop is source- AND port-scoped
    iifname "ombra-intnet" ip saddr 10.55.10.0/24 udp dport 53 counter accept comment "desktop DNS -> dnsmasq -> Tor DNSPort"
    iifname "ombra-intnet" ip saddr 10.55.10.0/24 tcp dport 53 counter accept comment "desktop DNS over TCP (truncated-answer fallback) -> dnsmasq"
    iifname "ombra-intnet" ip saddr 10.55.10.0/24 tcp dport 9050 counter accept comment "desktop SOCKS-aware apps -> Tor SocksPort"
    iifname "ombra-intnet" ip saddr 10.55.10.0/24 tcp dport 9040 counter accept comment "desktop transparent TCP -> Tor TransPort (arrives via the prerouting REDIRECT)"
    iifname "ombra-intnet" ip saddr 10.55.10.0/24 tcp dport 9052 counter accept comment "desktop Tor Browser -> control-port filter (read-only dialect; the real control port never leaves loopback)"

    # link diagnostics; must precede the blanket icmp drop below
    iifname "ombra-intnet" ip saddr 10.55.10.0/24 ip protocol icmp icmp type echo-request counter accept comment "desktop ping -> gateway (link diagnostics)"

    # only what PMTUD needs end-to-end
    ip protocol icmp icmp type destination-unreachable counter accept
    ip protocol icmp counter drop
    ip6 nexthdr icmpv6 counter drop comment "no IPv6 anywhere, ever"

    # counted: counters feed the leak tests
    counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    # intentionally empty: the desktop is proxied, never routed; reject so non-proxiable traffic fails fast
    counter reject comment "forwarding prohibited - desktop traffic must arrive as prerouting REDIRECTs, not routed packets"
  }

  chain output {
    type filter hook output priority filter; policy drop;

    ct state invalid counter drop
    tcp flags & (fin | syn | rst | ack) == fin | syn counter drop
    tcp flags & (syn | rst) == syn | rst counter drop
    ip frag-off & 0x1fff != 0 counter drop

    ct state established,related counter accept

    oifname "lo" counter accept

    # Tor is the ONLY egress, on any port (bridges need arbitrary ports)
    meta skuid "debian-tor" oifname "ombra-upstream" counter accept comment "Tor egress - the gateway's entire purpose"

    # onion services the desktop publishes (OnionShare): Tor, and only Tor, may connect back to the desktop on this port range
    meta skuid "debian-tor" oifname "ombra-intnet" ip daddr 10.55.10.0/24 tcp dport 17600-17659 counter accept comment "Tor onion service -> desktop OnionShare listener"

    ip protocol icmp icmp type destination-unreachable icmp code frag-needed counter accept

    # the DISCOVER/REQUEST the gateway itself sends for its upstream lease
    oifname "ombra-upstream" udp sport 68 udp dport 67 counter accept comment "gateway DHCP client -> upstream lease"

    counter reject comment "fail-closed: nothing but Tor leaves this VM"
  }
}

# ---- ip nat: transparent proxying for the desktop ----
table ip nat {

  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;

    # stray desktop DNS converges on dnsmasq (Tor-only upstream)
    iifname "ombra-intnet" ip daddr != 10.55.10.1 udp dport 53 counter redirect to :53 comment "stray desktop DNS -> dnsmasq (Tor-only upstream)"

    # desktop TCP -> Tor TransPort (LOCAL input, never forwarded); .onion via torrc's VirtualAddrNetwork
    iifname "ombra-intnet" ip saddr 10.55.10.0/24 ip daddr != 10.55.10.1 \
      tcp flags & (fin | syn | rst | ack) == syn counter redirect to :9040 \
      comment "desktop TCP -> Tor TransPort (transparent proxy)"
  }
}

# no IPv6 table: the sysctl overlay disables the stack
