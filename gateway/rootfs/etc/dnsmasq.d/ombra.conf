# DNS-only, the desktop's only resolver: every query forwards to Tor's DNSPort on loopback. NO DHCP (the desktop ships a static profile).

# only the internal network (names pinned by NIC driver via the systemd .link files)
interface=ombra-intnet
# bind-dynamic: dnsmasq may start before networkd puts 10.55.10.1 up
bind-dynamic
except-interface=lo
except-interface=ombra-upstream

# the single upstream is Tor's DNSPort; never read /etc/resolv.conf
no-resolv
no-hosts
server=127.0.0.1#5353
bogus-priv
