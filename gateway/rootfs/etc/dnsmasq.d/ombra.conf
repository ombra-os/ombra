# The desktop's resolver address, answering from this file alone: NOTHING is forwarded, to Tor or anywhere else.
# Desktop applications resolve names by handing them to Tor's SOCKS port (socks5h); a plain DNS lookup has no use on a
# machine whose firewall only allows connections to this gateway. Forwarding to Tor's DNSPort is what let a desktop
# flood Tor's address map (TROVE-2026-036), so there is no DNSPort and no upstream here. NO DHCP either.

# only the internal network (names pinned by NIC driver via the systemd .link files)
interface=ombra-intnet
# bind-dynamic: dnsmasq may start before networkd puts 10.55.10.1 up
bind-dynamic
except-interface=lo
except-interface=ombra-upstream

# no upstream at all: never read /etc/resolv.conf, never read /etc/hosts, no server= line
no-resolv
no-hosts
bogus-priv
# every name is answered here with "no such name", at once
address=/#/
# except .onion, which gets one fixed placeholder: the status probe of desktops installed before 1.2.2 expects an
# onion name to answer inside 10.66.0.0/16 (it used to come from Tor's automap) and would show amber without it.
# The address is never routed anywhere: onion services are reached by name over SOCKS
address=/onion/10.66.0.1
