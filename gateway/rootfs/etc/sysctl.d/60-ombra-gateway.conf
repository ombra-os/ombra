# Ombra gateway kernel parameters — part of the fail-closed contract.

# the desktop is proxied, never routed (defense in depth with nftables)
net.ipv4.ip_forward = 0

# a spoofed source is dropped
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# never accept or send ICMP redirects (MITM lever on a two-NIC box)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# IPv6 off: a half-configured v6 stack is the classic leak
-net.ipv6.conf.all.disable_ipv6 = 1
-net.ipv6.conf.default.disable_ipv6 = 1

net.ipv4.conf.all.log_martians = 1

# console = errors only (kernel chatter must not paint over tty1)
kernel.printk = 3 4 1 3

# ---- privilege-escalation surface ----
# Only keys weaker than the trixie default are set. kernel.modules_disabled
# is deliberately NOT set: systemd-sysctl runs before nftables, and
# forbidding module loads would keep the nf_tables modules from loading.

# no kernel pointers, even via %pK
kernel.kptr_restrict = 2

# no ring-buffer reads (addresses, symbols)
kernel.dmesg_restrict = 1

# no hardware performance counters at all (side channels)
kernel.perf_event_paranoid = 3

kernel.sysrq = 0

# no ptrace at all, even same-user (credential-scraping block)
kernel.yama.ptrace_scope = 3

# no runtime kernel replacement, even for root (immutable image)
kernel.kexec_load_disabled = 1

# io_uring: outsized kernel-CVE share, nothing here uses it
kernel.io_uring_disabled = 2

# 1 locks unprivileged BPF until reboot — nothing may re-enable it
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

dev.tty.ldisc_autoload = 0

# no injecting keystrokes into other users' ttys
dev.tty.legacy_tiocsti = 0

# core dumps go nowhere, setuid dumps included
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0

# ---- network-stack integrity ----

net.ipv4.tcp_rfc1337 = 1

# timestamps leak uptime (and with it, boot-time correlation)
net.ipv4.tcp_timestamps = 0

# ARP discipline on a two-NIC router: answer only on the owning interface; treat gratuitous ARPs as spoof traffic
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_filter = 1
net.ipv4.conf.default.arp_filter = 1
net.ipv4.conf.all.drop_gratuitous_arp = 1
net.ipv4.conf.default.drop_gratuitous_arp = 1

# the desktop's status panel probes the gateway by ping — this stays 0
net.ipv4.icmp_echo_ignore_all = 0

# a panicked router reboots instead of hanging half-alive
kernel.panic = -1

fs.protected_fifos = 2

# ---- memory ----

# 65536 is the security-misc floor below which NULL-deref tricks live
vm.mmap_min_addr = 65536

# full ASLR
kernel.randomize_va_space = 2

# 512MB box with an installer-sized swap: park in RAM first. The swap
# itself is disabled at boot by overlayroot.
vm.swappiness = 1
