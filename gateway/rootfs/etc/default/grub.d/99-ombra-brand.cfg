# Ombra branding: GRUB_DISTRIBUTOR drives the generated entry names.
GRUB_DISTRIBUTOR="Ombra"
GRUB_TIMEOUT=-1
GRUB_RECORDFAIL_TIMEOUT=-1
GRUB_TIMEOUT_STYLE=menu
GRUB_DEFAULT=0
GRUB_DISABLE_RECOVERY=true
GRUB_DISABLE_SUBMENU=y
GRUB_DISABLE_OS_PROBER=true
GRUB_GFXMODE=1280x800,1024x768,auto
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_FONT=/boot/grub/fonts/unicode.pf2
GRUB_THEME=/boot/grub/themes/ombra/theme.txt
GRUB_COLOR_NORMAL="white/black"
GRUB_COLOR_HIGHLIGHT="black/light-gray"
