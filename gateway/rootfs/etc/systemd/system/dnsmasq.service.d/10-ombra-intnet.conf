# start only once ombra-intnet has 10.55.10.1 (bind-dynamic binds per address
# and follows changes; the wait makes a missing link fail loudly): wait up to
# 10s, fail, and retry so a slow boot still ends with desktop DNS.
[Unit]
After=systemd-networkd.service

[Service]
Restart=on-failure
RestartSec=2
ExecStartPre=/bin/sh -c 'i=0; while ! ip -4 addr show dev ombra-intnet 2>/dev/null | grep -q "inet 10.55.10.1"; do i=$((i+1)); [ "$i" -ge 50 ] && exit 1; sleep 0.2; done'
