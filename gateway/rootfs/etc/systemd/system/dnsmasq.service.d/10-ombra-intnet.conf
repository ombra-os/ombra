# dnsmasq must not bind before ombra-intnet has 10.55.10.1 (bind-dynamic
# would fall back to a wildcard bind): wait up to 10s, then fail loudly.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while ! ip -4 addr show dev ombra-intnet 2>/dev/null | grep -q "inet 10.55.10.1"; do i=$((i+1)); [ "$i" -ge 50 ] && exit 1; sleep 0.2; done'
