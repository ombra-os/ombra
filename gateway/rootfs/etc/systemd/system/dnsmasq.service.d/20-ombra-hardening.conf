# dnsmasq keeps exactly the three network capabilities it runs on (re-binds :53 on interface events, netlink link-watch).
# Filesystem stays read-only: DNS-only mode writes nothing but its pid dir (DHCP would need a writable lease path here).
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE CAP_NET_RAW CAP_SETUID CAP_SETGID
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE CAP_NET_RAW CAP_SETUID CAP_SETGID
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
RuntimeDirectory=dnsmasq
ReadWritePaths=/run/dnsmasq
MemoryDenyWriteExecute=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
