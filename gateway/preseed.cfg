# Ombra gateway — debian-installer preseed (Debian trixie, arm64), packed into the install ISO initrd.
# The grub entry runs FULLY UNATTENDED (auto=true priority=critical) — any question that surfaces is a bug here.
# The gateway disk is intentionally UNENCRYPTED (it holds no user data);
# the ombra account is born locked (no password hash); no sshd ships.

### ---- Locale / console ----

d-i debian-installer/locale string en_US
d-i keyboard-configuration/xkb-keymap select us

### ---- Network ----
# The intnet NIC is DISCONNECTED during install, so "auto" can only pick the NAT link.

d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_failed note
# pin all template variants or the console will ask
d-i netcfg/hostname string ombra-gateway
d-i netcfg/get_hostname string ombra-gateway
d-i netcfg/get_domain string local

### ---- Mirror ----

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/suite string trixie
d-i mirror/http/proxy string

# question names must be FULL (apt-setup/...) — unknown short names register as dead dummy questions
apt-setup apt-setup/security_host string deb.debian.org
apt-setup apt-setup/services-select multiselect security, updates
apt-setup apt-setup/non-free-firmware boolean true
apt-setup apt-setup/non-free boolean false
apt-setup apt-setup/contrib boolean true
apt-setup apt-setup/enable-source-repositories boolean false
# a transiently-unreachable mirror must not stall the run (the main mirror failing stays LOUD)
apt-setup apt-setup/service-failed boolean true
# never configure apt from the install media (not a Debian media)
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false

### ---- Accounts ----
# Root and ombra are both born locked (`*`) and in no groups; console autologin and the sudoers grants need no password.

d-i passwd/root-login boolean false
d-i passwd/root-password-crypted string *
d-i passwd/user-fullname string ombra
d-i passwd/username string ombra
d-i passwd/user-password-crypted string *
d-i passwd/user-default-groups string
d-i user-setup/allow-password-weak boolean true

### ---- Clock ----
# Fusion populates the RTC with the HOST'S LOCAL time: utc=false plus the build host's zone is the
# only deterministic decode (sqv rejects fresh repo signatures otherwise); the late command normalizes to UTC.
d-i clock-setup/utc boolean false
d-i clock-setup/ntp boolean true
d-i time/zone string America/New_York

### ---- Partitioning: plain, no encryption ----
# Budgeted for the 5GB disk (512 EFI + root); no swap partition: the amnesic overlay never uses one.
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select efi-root
d-i partman-auto/expert_recipe string              \
   efi-root ::                                \
      512 512 512 fat32                            \
         $primary{ } $bootable{ }                  \
         method{ efi } format{ }                   \
      .                                            \
      3500 3500 -1 ext4                            \
         method{ format } format{ }                \
         use_filesystem{ } filesystem{ ext4 }      \
         mountpoint{ / }                           \
      .

d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### ---- Package selection ----
# Everything installed here from the pinned suite, so the overlay only ships configuration.
# open-vm-tools BASE (headless); NO ssh (build/test access is vmrun guest ops); libssl3t64 FIRST.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string libssl3t64 nftables tor dnsmasq overlayroot fonts-dejavu-core open-vm-tools curl ca-certificates zsh zsh-autosuggestions zsh-syntax-highlighting starship ripgrep fd-find bat eza fzf zoxide
popularity-contest popularity-contest/participate boolean false
man-db man-db/auto-update boolean false
d-i pkgsel/upgrade select none

### ---- GRUB ----

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
# No console=: the kernel has no serial driver on this platform, and a dead console= would sink /dev/console.

### ---- Finish ----

d-i finish-install/reboot_in_progress note
# power off (not reboot): poweroff is the install-finished signal
d-i debian-installer/exit/poweroff boolean true
