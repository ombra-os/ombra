# Ombra unattended installer boot entry (mapped over /boot/grub/grub.cfg
# by build/make-install-iso.sh). The preseed rides inside the extended
# initrd; console=tty0 = /dev/console = the display, never a serial line.
set timeout=3
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
menuentry "ombra install (unattended)" {
    set root=(cd0)
    linux /install.a64/vmlinuz auto=true priority=critical quiet console=tty0 ---
    initrd /install.a64/initrd.gz
}
