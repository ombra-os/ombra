# Ombra single-edition installer boot entry (mapped over /boot/grub/grub.cfg by build/make-install-iso.sh single).
# Same kernel line as build/installer-grub.cfg: the preseed answers everything except the two questions it leaves
# out (the disk passphrase and the account password, both asked at priority critical), so nothing is typed here.
set timeout=3
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
menuentry "Install Ombra (single VM)" {
    # not (cd0): a UTM VM may carry the ISO on a USB or virtio drive; if the search finds nothing, root stays the
    # device this file was read from, which is the ISO
    search --no-floppy --set=root --file /install.a64/initrd.gz
    linux /install.a64/vmlinuz auto=true priority=critical quiet console=tty0 ---
    initrd /install.a64/initrd.gz
}
